# Fully resolved environment for GraphCast -- every package, including the
# transitive ones `requirements.txt` leaves to the resolver (21 direct pins
# become ~150 installed packages). Install this file instead of
# `requirements.txt` to get the same versions this was built with, whatever
# PyPI has moved on to since:
#
#     pip install --no-cache-dir -r requirements.lock
#
# This matters more here than in the other two environments: the JAX ecosystem
# packages are exactly the ones that broke against jax 0.4.29 once already
# (dm-haiku 0.0.17 -- see the comment in `requirements.txt`), and the same
# class of breakage can come from any unpinned transitive dependency.
#
# `requirements.txt` stays the readable, hand-maintained list of direct
# dependencies and the reasoning behind each pin; this file is generated from
# it and never edited by hand. Regenerate with the command below (needs `uv`).
# Two flags are load-bearing:
#   --universal            one file serves both interpreters; packages that
#                          differ carry a `python_full_version` marker (and
#                          torch a platform marker: the +cu124 build on x86_64
#                          Linux, the plain build elsewhere).
#   --index-strategy unsafe-best-match
#                          uv otherwise refuses to look past the first index
#                          that has a package, and reports torch==2.6.0+cu124
#                          as unsatisfiable. pip already searches both indexes,
#                          so this only makes uv match pip's behaviour.
#
# This file was autogenerated by uv via the following command:
#    uv pip compile --universal --python-version 3.11 --index-strategy unsafe-best-match --emit-index-url requirements.txt -o requirements.lock
--index-url https://pypi.org/simple
--extra-index-url https://download.pytorch.org/whl/cu124

